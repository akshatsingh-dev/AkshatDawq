name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project DAWQ.xcodeproj -scheme DAWQ

      - name: Build
        run: xcodebuild -project DAWQ.xcodeproj -scheme DAWQ -destination 'platform=iOS Simulator,name=iPhone 16 Pro' build
